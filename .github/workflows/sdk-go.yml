name: SDK Go

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/sdk-go.yml"
      - "go.mod"
      - "go.sum"
      - "sdk/golang/**"
      - "proto/**"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/sdk-go.yml"
      - "go.mod"
      - "go.sum"
      - "sdk/golang/**"
      - "proto/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go SDK tests
        run: go test -v ./sdk/golang/bytestack/...
