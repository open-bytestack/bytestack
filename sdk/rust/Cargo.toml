[package]
name = "bytestack-sdk"
version.workspace = true
edition.workspace = true
description = "Bytestack SDK — local directory writer for the bytestack storage format"
keywords = ["bytestack", "haystack", "storage", "sdk"]

[dependencies]
bytestack = { workspace = true }
tokio = { version = "1", features = ["fs", "io-util", "process"] }
rand = "0.8"
bincode = "1.3"
serde_json = "1.0"
proto = { workspace = true }
tonic = { workspace = true }
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"
bytes = "1"

[dev-dependencies]
aws-sdk-s3 = "1"
aws-config = "1"
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
